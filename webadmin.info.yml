name: Web Admin
description: Website Administration tools.
type: module
core_version_requirement: ^11.4 || ^12
# The modules the default recipe installs. Declared here, so Drupal installs
# them in the same batch before hook_install() applies the recipe: installing
# them from inside hook_install() would rebuild the container and leave the
# config installer of the outer batch in syncing mode, so later modules in the
# batch would lose their default config entities.
# Not every module the recipe installs can be a dependency:
# - Toolbar and Shortcut: Drupal 12 removes them from core, so a hard
#   dependency would block Drupal 12.
# - Package Manager and Automatic Updates (which depends on it): Package
#   Manager refuses to install unless 'testing_package_manager' is TRUE in
#   settings.php, so a hard dependency makes every install of this module fail
#   the requirements check. The recipe still installs them.
# - Claro and the Default Admin theme: a module cannot depend on a theme.
dependencies:
  - drupal:announcements_feed
  - drupal:config
  - drupal:contextual
  - drupal:dblog
  - drupal:field_ui
  - drupal:help
  - drupal:node
  - drupal:update
  - drupal:views_ui
  - drupal:content_moderation
  - drupal:workflows
  - coffee:coffee
  - drupical:drupical
  - project_browser:project_browser
  - sam:sam
  - tagify:tagify
  - tagify:tagify_user_list
  - view_password:view_password
  - views_bulk_operations:views_bulk_operations
  - views_bulk_edit:views_bulk_edit
  - masquerade:masquerade
