name: Web Admin - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  # Core administration tools.
  - announcements_feed
  - config
  - contextual
  - dblog
  - field_ui
  - help
  - node
  - update
  - views_ui
  - content_moderation
  - workflows
  # Contrib administration tools. Package Manager is listed, so the recipe
  # can set its trusted Composer plugins.
  - package_manager
  - automatic_updates
  - coffee
  - drupical
  - project_browser
  - sam
  - tagify
  - tagify_user_list
  - view_password
  - views_bulk_operations
  - views_bulk_edit
  - masquerade
  - uikit_admin
  # Last, after its dependencies: the Web Admin module itself.
  - webadmin
config:
  strict: false
  import:
    # Recipe installs skip config entities in config/optional: import them.
    uikit_admin:
      - block.block.uikit_admin_branding
      - block.block.uikit_admin_breadcrumbs
      - block.block.uikit_admin_content
      - block.block.uikit_admin_help
      - block.block.uikit_admin_local_actions
      - block.block.uikit_admin_messages
      - block.block.uikit_admin_page_title
      - block.block.uikit_admin_primary_local_tasks
      - block.block.uikit_admin_secondary_local_tasks
  actions:
    # Use UIkit Admin as the back-end theme.
    system.theme:
      simpleConfigUpdate:
        admin: uikit_admin
    # Edit and add content in the administration theme.
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    user.settings:
      simpleConfigUpdate:
        verify_mail: true
        register: admin_only
        cancel_method: user_cancel_block
    # Content editors get contextual links and the admin theme; Coffee stays with site administrators.
    ?user.role.content_editor:
      grantPermissions:
        - 'access contextual links'
        - 'view the administration theme'
    announcements_feed.settings:
      simpleConfigUpdate:
        limit: 2
    core.menu.static_menu_link_overrides:
      overrideMenuLinks:
        announcements_feed.announcement:
          enabled: false
    automatic_updates.settings:
      simpleConfigUpdate:
        allow_core_minor_updates: true
    # The Webship projects apply their patches with these Composer plugins.
    # Trust them, so the automatic updates readiness checks pass.
    package_manager.settings:
      simpleConfigUpdate:
        additional_trusted_composer_plugins:
          - cweagans/composer-patches
          - webship/patches
    drupical.settings:
      simpleConfigUpdate:
        limit: 5
    project_browser.admin_settings:
      simpleConfigUpdate:
        allow_ui_install: true
        max_selections: 1
    tagify.settings:
      simpleConfigUpdate:
        set_default_widget: true
    update.settings:
      simpleConfigUpdate:
        check.disabled_extensions: true
    # The show password button on the log in form and on the one-time login
    # form of a password reset.
    view_password.settings:
      simpleConfigUpdate:
        form_ids: 'user_login_form,user_pass_reset'
