name: Web Admin - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - content_moderation
  - workflows
  - toolbar
  - shortcut
  - layout_builder
  - navigation
  - views_bulk_operations
  - views_bulk_edit
  - masquerade
  # The Gin administration theme must be installed before the Gin Toolbar and
  # Gin Login modules, which build on it.
  - gin
  - gin_toolbar
  - gin_login
  - dashboards
config:
  strict: false
  import:
    dashboards: '*'
  actions:
    # Use Gin as the administration (back-end) theme. This is the headline of
    # the Web Admin module: a polished, productive admin experience.
    system.theme:
      simpleConfigUpdate:
        admin: gin
